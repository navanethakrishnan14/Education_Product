name: Validate project

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Platform_Backend
          - app: Platform_frontend
          - app: Tenant_backend
          - app: Tenant_frontend
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Some frontend folders do not have a committed lockfile yet, so use
      # npm install rather than npm ci until lockfiles are checked in.
      - run: npm install
      - run: npm run build
        env:
          # Prisma config requires DATABASE_URL while generating the client; the build does not connect to this placeholder database.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edusphere_platform?schema=public
