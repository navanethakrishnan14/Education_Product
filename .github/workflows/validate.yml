name: Validate project

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Platform_Backend
            command: npm run build
          - app: Platform_frontend
            command: npm run build
          - app: Tenant_backend
            command: npm run build
          - app: Tenant_frontend
            command: npm run build
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: ${{ matrix.command }}
